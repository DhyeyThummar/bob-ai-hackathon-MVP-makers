submission:
  title: "AI Smart Product Recommendation Assistant"
                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Retail stores rely on experienced staff to guide customers through complex product
    decisions, but expert staff are a bottleneck at scale and their knowledge disappears
    when they leave. Customers saying "I want to build a dining table" or "I want to mount
    my TV" do not know all the products, materials, and quantities they need — and generic
    e-commerce filters cannot reason over product relationships the way an expert does.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    We built a frontend-only React app that combines a Gemini 1.5 Flash LLM layer for
    natural-language understanding with a deterministic JavaScript rules engine for reliable
    product selection and quantity computation. The assistant asks follow-up questions,
    reasons over a product graph, produces a complete shopping list with per-item reasoning,
    and escalates to a human expert when confidence is low. IBM Bob was used as the primary
    engineering tool throughout design, implementation, and documentation.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Hybrid LLM + rules + tag engine: Gemini extracts intent and slots; hardcoded rules compute quantities; tag engine makes ANY shopkeeper-added product immediately recommendable"
    - "Shopkeeper admin module: full product CRUD with flexible key-value specs, fits-for tags, usage guide, troubleshooting guide, and bulk JSON import/export"
    - "Budget-aware open-ended recommendations: 'decorate my room for £1000' distributes budget sensibly across product categories using tag matching"
    - "Multi-screen app with currency personalisation: 8-currency mock exchange rate table, product detail page with specs and troubleshooting, settings, shopkeeper dashboard"
    - "Deterministic offline fallback + human-expert escalation: all scenarios work with no API key; low-confidence requests surface a visible escalation banner with collected context"

  tech_stack:
    languages: ["JavaScript", "JSX", "CSS"]    # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["React 18", "Vite 5", "React Router 6"]  # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM Bob"]              # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["localStorage"]               # e.g., ["PostgreSQL", "Redis"]
    other: ["Gemini 1.5 Flash REST API", "CSS Modules", "GitHub Actions"]
                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    The hybrid engine design: the LLM handles natural language understanding while a
    deterministic rules layer owns all product decisions and quantity calculations. This
    makes recommendations reliable, auditable, and demo-safe — the app works correctly
    even when the API is rate-limited. The reasoning shown per item ("Recommended because
    you said 6-seat oak table → 2 sheets, oak veneer → danish oil finish") is what makes
    it feel genuinely expert-like rather than a generic chatbot.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    The product catalog is mock data with approximate prices — not connected to a live
    inventory system. Only four project scenarios are supported out of the box; new scenarios
    require adding a rule file and catalog entries. No PDF export — lists export as .txt or .json.

