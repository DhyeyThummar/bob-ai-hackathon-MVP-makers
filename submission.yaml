submission:
  title: "Drug Safety Copilot: Signal Detection & Submission Readiness Checker"
                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
   Pharmaceutical companies face two major challenges: detecting genuine drug safety
    signals hidden within millions of adverse-event reports and manually checking large
    regulatory dossiers for missing CTD sections. These processes are time-consuming,
    error-prone, and can delay critical safety decisions and drug submissions.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
   We built an AI-powered Drug Safety Copilot with two modes: Signal Detection, which
    analyzes real FDA FAERS data using PRR and chi-square statistics to identify and rank
    potential drug–event safety signals, and Submission Readiness, which checks a drug
    dossier against ICH M4 CTD requirements and generates a completeness score and gap report.
    IBM Bob is used throughout development for agent workflows, document understanding,
    testing, and code generation.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Real FDA FAERS data analysis with PRR and chi-square based drug–event signal detection"
    - "Ranked and explainable safety signals with AI-generated narrative interpretation"
    - "ICH M4 CTD checklist-based dossier completeness scoring"
    - "Severity-ranked submission gap report with recommended next steps"
    - "Unified AI copilot dashboard with Signal Detection and Submission Readiness modes"

  tech_stack:
    languages: ["Python"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["Streamlit", "pandas", "scipy"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM Bob", "watsonx.ai"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["SQLite", "DuckDB"]                      # e.g., ["PostgreSQL", "Redis"]
    other: ["openFDA FAERS API", "Plotly", "pdfplumber", "python-docx", "rapidfuzz", "GitHub"]
                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    Our strongest aspect is that the solution combines real-world FDA safety data with
    explainable statistical analysis and regulatory document checking in one practical
    copilot, rather than relying on a fabricated chatbot demo. The system provides judges
    with both ranked safety signals and an actionable CTD gap report.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    The submission-readiness demonstration uses a realistic mock CTD dossier because real
    unredacted regulatory submissions are commercially confidential. The system also
    relies on cached FAERS data as a fallback if the public API is unavailable or
    rate-limited during the demo.

